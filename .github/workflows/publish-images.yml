name: Build and publish container images

on:
  push:
    branches:
      - main
    paths-ignore:
      - k8s/**
      - argocd/**
      - .claude/**
      - docs/**
      - README.md
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend-quality:
    name: Test and coverage — ${{ matrix.component }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component:
          - customer-service
          - loan-service
          - product-service
          - decision-service
          - notification-service

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: backend/${{ matrix.component }}/**/*.gradle*

      - name: Run all tests and enforce coverage
        working-directory: backend/${{ matrix.component }}
        run: ./gradlew clean check --no-daemon

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-${{ matrix.component }}
          path: backend/${{ matrix.component }}/build/reports/jacoco/test/
          if-no-files-found: ignore
          retention-days: 14

  frontend-quality:
    name: Validate frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  publish:
    name: Publish ${{ matrix.component }}
    needs:
      - backend-quality
      - frontend-quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: customer-service
            context: ./backend/customer-service
          - component: loan-service
            context: ./backend/loan-service
          - component: product-service
            context: ./backend/product-service
          - component: decision-service
            context: ./backend/decision-service
          - component: notification-service
            context: ./backend/notification-service
          - component: frontend
            context: ./frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/originate-${{ matrix.component }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  deploy-manifests:
    name: Pin deployment images
    needs:
      - publish
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Check out main branch
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Pin every published image to the source commit
        shell: bash
        run: |
          set -euo pipefail
          for component in customer-service loan-service product-service decision-service notification-service frontend; do
            manifest="k8s/apps/${component}/deployment.yaml"
            sed -i -E "s|(image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/originate-${component}:).*|\\1sha-${GITHUB_SHA}|" "${manifest}"
          done

      - name: Commit GitOps deployment revision
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- k8s/apps; then
            echo "Deployment manifests already reference ${GITHUB_SHA}."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/apps/*/deployment.yaml
          git commit -m "Deploy images from ${GITHUB_SHA::7} [skip ci]"
          git push origin main
