spring.application.name=loan-service
server.port=${SERVER_PORT:8082}

spring.datasource.url=${DB_URL:jdbc:h2:mem:loans;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}

customer-service.url=${CUSTOMER_SERVICE_URL:http://localhost:8081}
product-service.url=${PRODUCT_SERVICE_URL:http://localhost:8083}
decision-service.url=${DECISION_SERVICE_URL:http://localhost:8084}
demo.error.enabled=${DEMO_ERROR_ENABLED:false}
demo.error.simulated-timeout-ms=${DEMO_ERROR_TIMEOUT_MS:3000}
demo.bigdecimal.error.enabled=${DEMO_BIGDECIMAL_ERROR_ENABLED:false}
demo.third-party.api-upgrade.enabled=${DEMO_THIRD_PARTY_API_UPGRADE_ENABLED:false}

management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.tags.service=${spring.application.name}
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

observability.http.max-payload-bytes=${HTTP_LOG_MAX_PAYLOAD_BYTES:8192}
logging.level.org.springframework.web=WARN
logging.level.org.apache.catalina=WARN
logging.level.org.hibernate=WARN
logging.level.com.zaxxer.hikari=WARN
logging.level.org.springframework.orm.jpa=WARN
logging.level.org.springframework.data.repository.config=WARN

logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5level service=${spring.application.name} requestId=%X{requestId:-none} thread=%thread logger=%logger{36} message=%msg%n%ex
