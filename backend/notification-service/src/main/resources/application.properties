spring.application.name=notification-service
server.port=${SERVER_PORT:8085}
postmortem.output-dir=${POSTMORTEM_OUTPUT_DIR:docs/postmortems}

management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.tags.service=${spring.application.name}
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

lark.webhooks.customer-service=${LARK_WEBHOOK_CUSTOMER_SERVICE:}
lark.webhooks.loan-service=${LARK_WEBHOOK_LOAN_SERVICE:}
lark.webhooks.product-service=${LARK_WEBHOOK_PRODUCT_SERVICE:}
lark.webhooks.decision-service=${LARK_WEBHOOK_DECISION_SERVICE:}
lark.webhooks.notification-service=${LARK_WEBHOOK_NOTIFICATION_SERVICE:}
lark.webhooks.frontend=${LARK_WEBHOOK_FRONTEND:}
lark.webhooks.platform=${LARK_WEBHOOK_PLATFORM:}

haaland.api-base-url=${HAALAND_API_BASE_URL:}
haaland.api-auth-token=${HAALAND_API_AUTH_TOKEN:}
haaland.repo-url=${HAALAND_REPO_URL:}
haaland.base-ref=${HAALAND_BASE_REF:main}
kubernetes.workload-namespace=${KUBERNETES_WORKLOAD_NAMESPACE:originate}

observability.http.max-payload-bytes=${HTTP_LOG_MAX_PAYLOAD_BYTES:16384}
logging.level.org.springframework.web=WARN
logging.level.org.apache.catalina=WARN
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5level service=${spring.application.name} requestId=%X{requestId:-none} thread=%thread logger=%logger{36} message=%msg%n%ex
