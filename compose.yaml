name: originate

services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: originate
      POSTGRES_USER: originate
      POSTGRES_PASSWORD: ${DB_PASSWORD:-originate-local}
    volumes:
      - originate-postgres-data:/var/lib/postgresql/data
      - ./k8s/apps/database/init-schemas.sql:/docker-entrypoint-initdb.d/01-init-schemas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U originate -d originate"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  customer-service:
    build:
      context: ./backend/customer-service
    image: originate/customer-service:local
    environment:
      SERVER_PORT: 8081
      APP_CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:3000}
      DB_URL: jdbc:postgresql://database:5432/originate?currentSchema=customer_service
      DB_USERNAME: originate
      DB_PASSWORD: ${DB_PASSWORD:-originate-local}
      H2_CONSOLE_ENABLED: "false"
    expose:
      - "8081"
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  product-service:
    build:
      context: ./backend/product-service
    image: originate/product-service:local
    environment:
      SERVER_PORT: 8083
    expose:
      - "8083"
    restart: unless-stopped

  decision-service:
    build:
      context: ./backend/decision-service
    image: originate/decision-service:local
    environment:
      SERVER_PORT: 8084
    expose:
      - "8084"
    restart: unless-stopped

  loan-service:
    build:
      context: ./backend/loan-service
    image: originate/loan-service:local
    environment:
      SERVER_PORT: 8082
      CUSTOMER_SERVICE_URL: http://customer-service:8081
      PRODUCT_SERVICE_URL: http://product-service:8083
      DECISION_SERVICE_URL: http://decision-service:8084
      DEMO_ERROR_ENABLED: ${DEMO_ERROR_ENABLED:-false}
      DEMO_BIGDECIMAL_ERROR_ENABLED: ${DEMO_BIGDECIMAL_ERROR_ENABLED:-false}
      APP_CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:3000}
      DB_URL: jdbc:postgresql://database:5432/originate?currentSchema=loan_service
      DB_USERNAME: originate
      DB_PASSWORD: ${DB_PASSWORD:-originate-local}
      H2_CONSOLE_ENABLED: "false"
    expose:
      - "8082"
    depends_on:
      database:
        condition: service_healthy
      customer-service:
        condition: service_started
      product-service:
        condition: service_started
      decision-service:
        condition: service_started
    restart: unless-stopped

  notification-service:
    build:
      context: ./backend/notification-service
    image: originate/notification-service:local
    environment:
      SERVER_PORT: 8085
      LARK_WEBHOOK_CUSTOMER_SERVICE: ${LARK_WEBHOOK_CUSTOMER_SERVICE:-}
      LARK_WEBHOOK_LOAN_SERVICE: ${LARK_WEBHOOK_LOAN_SERVICE:-}
      LARK_WEBHOOK_PRODUCT_SERVICE: ${LARK_WEBHOOK_PRODUCT_SERVICE:-}
      LARK_WEBHOOK_DECISION_SERVICE: ${LARK_WEBHOOK_DECISION_SERVICE:-}
      LARK_WEBHOOK_FRONTEND: ${LARK_WEBHOOK_FRONTEND:-}
      LARK_WEBHOOK_NOTIFICATION_SERVICE: ${LARK_WEBHOOK_NOTIFICATION_SERVICE:-}
      LARK_WEBHOOK_PLATFORM: ${LARK_WEBHOOK_PLATFORM:-}
    expose:
      - "8085"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    image: originate/frontend:local
    ports:
      - "3000:80"
    depends_on:
      - customer-service
      - loan-service
    restart: unless-stopped

volumes:
  originate-postgres-data:
