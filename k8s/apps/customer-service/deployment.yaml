apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-service
  labels:
    app.kubernetes.io/name: customer-service
    app.kubernetes.io/part-of: originate
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: customer-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: customer-service
        app.kubernetes.io/part-of: originate
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: customer-service
          image: ghcr.io/soitcommittee/originate-customer-service:sha-9617c5bea2f2ff6ac64a84d6e765d1dc37f4c1ca
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: SERVER_PORT
              value: "8081"
            - name: DB_URL
              value: jdbc:postgresql://originate-postgres:5432/originate?currentSchema=customer_service
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: originate-database-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: originate-database-credentials
                  key: password
            - name: H2_CONSOLE_ENABLED
              value: "false"
            - name: APP_CORS_ALLOWED_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: customer-service-config
                  key: CORS_ALLOWED_ORIGIN
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 4
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: customer-service
  labels:
    app.kubernetes.io/name: customer-service
    app.kubernetes.io/part-of: originate
spec:
  selector:
    app.kubernetes.io/name: customer-service
  ports:
    - name: http
      port: 8081
      targetPort: http
