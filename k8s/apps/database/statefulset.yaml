apiVersion: v1
kind: Service
metadata:
  name: originate-postgres
  labels:
    app.kubernetes.io/name: originate-postgres
    app.kubernetes.io/part-of: originate
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: originate-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: originate-postgres
  labels:
    app.kubernetes.io/name: originate-postgres
    app.kubernetes.io/part-of: originate
spec:
  serviceName: originate-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: originate-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: originate-postgres
        app.kubernetes.io/part-of: originate
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: originate-database-credentials
                  key: database
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: originate-database-credentials
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: originate-database-credentials
                  key: password
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: schema-bootstrap
              mountPath: /docker-entrypoint-initdb.d/01-init-schemas.sql
              subPath: init-schemas.sql
              readOnly: true
      volumes:
        - name: schema-bootstrap
          configMap:
            name: originate-postgres-bootstrap
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: originate-postgres
          app.kubernetes.io/part-of: originate
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
