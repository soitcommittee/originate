apiVersion: apps/v1
kind: Deployment
metadata:
  name: decision-service
  labels:
    app.kubernetes.io/name: decision-service
    app.kubernetes.io/part-of: originate
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: decision-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: decision-service
        app.kubernetes.io/part-of: originate
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: decision-service
          image: ghcr.io/chiewhui1113/originate-decision-service:sha-9617c5bea2f2ff6ac64a84d6e765d1dc37f4c1ca
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8084
          env:
            - name: SERVER_PORT
              value: "8084"
            - name: DEMO_DECISION_ERROR_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: decision-service-config
                  key: DEMO_DECISION_ERROR_ENABLED
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 4
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: 75m
              memory: 192Mi
            limits:
              cpu: 400m
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: decision-service
  labels:
    app.kubernetes.io/name: decision-service
    app.kubernetes.io/part-of: originate
spec:
  selector:
    app.kubernetes.io/name: decision-service
  ports:
    - name: http
      port: 8084
      targetPort: http
