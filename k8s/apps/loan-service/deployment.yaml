apiVersion: apps/v1
kind: Deployment
metadata:
  name: loan-service
  labels:
    app.kubernetes.io/name: loan-service
    app.kubernetes.io/part-of: originate
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: loan-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loan-service
        app.kubernetes.io/part-of: originate
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: loan-service
          image: ghcr.io/soitcommittee/originate-loan-service:sha-8166ce567d870f7edc603c66019dab6bdc4841b4
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8082
          env:
            - name: SERVER_PORT
              value: "8082"
            - name: DB_URL
              value: jdbc:postgresql://originate-postgres:5432/originate?currentSchema=loan_service
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: originate-database-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: originate-database-credentials
                  key: password
            - name: H2_CONSOLE_ENABLED
              value: "false"
            - name: CUSTOMER_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: loan-service-config
                  key: CUSTOMER_SERVICE_URL
            - name: PRODUCT_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: loan-service-config
                  key: PRODUCT_SERVICE_URL
            - name: DECISION_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: loan-service-config
                  key: DECISION_SERVICE_URL
            - name: PAYMENT_PROVIDER_URL
              valueFrom:
                configMapKeyRef:
                  name: loan-service-config
                  key: PAYMENT_PROVIDER_URL
            - name: PAYMENT_PROVIDER_API_PATH
              valueFrom:
                configMapKeyRef:
                  name: loan-service-config
                  key: PAYMENT_PROVIDER_API_PATH
            - name: APP_CORS_ALLOWED_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: loan-service-config
                  key: CORS_ALLOWED_ORIGIN
            - name: DEMO_ERROR_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: loan-service-config
                  key: DEMO_ERROR_ENABLED
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 4
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: loan-service
  labels:
    app.kubernetes.io/name: loan-service
    app.kubernetes.io/part-of: originate
spec:
  selector:
    app.kubernetes.io/name: loan-service
  ports:
    - name: http
      port: 8082
      targetPort: http
