groups:
  - name: originate-service-alerts
    rules:
      - alert: Excessive5xxErrors
        expr: |
          sum by (service) (
            increase(http_server_requests_seconds_count{
              service=~"(customer|loan|product|decision)-service",
              status=~"5.."
            }[5m])
          ) >= 3
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "High server error volume on {{ $labels.service }}"
          description: "{{ $labels.service }} returned {{ $value | printf \"%.0f\" }} HTTP 5xx responses during the last five minutes."

      - alert: OriginateServiceDown
        expr: up{job=~"(customer|loan|product|decision|notification)-service"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service }} is unavailable"
          description: "Prometheus has been unable to scrape {{ $labels.service }} for at least two minutes."

      - alert: FrontendUnavailable
        expr: probe_success{job="frontend", service="frontend"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Originate frontend is unavailable"
          description: "The frontend health endpoint has failed continuously for at least two minutes."
