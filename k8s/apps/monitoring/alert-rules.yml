groups:
  - name: originate-service-alerts
    rules:
      - alert: Excessive5xxErrors
        expr: |
          sum by (service) (
            increase(http_server_requests_seconds_count{
              service=~"(customer|loan|product|decision)-service",
              status=~"5.."
            }[5m])
          ) >= 1
        labels:
          severity: critical
        annotations:
          summary: "High server error volume on {{ $labels.service }}"
          description: "{{ $labels.service }} returned {{ $value | printf \"%.0f\" }} HTTP 5xx responses during the last five minutes."
