global:
  resolve_timeout: 5m

route:
  receiver: originate-notification-api
  group_by:
    - alertname
    - service
  group_wait: 0s
  group_interval: 5m
  repeat_interval: 30m

receivers:
  - name: originate-notification-api
    webhook_configs:
      - url: http://notification-service.originate.svc.cluster.local:8085/api/alerts/alertmanager
        send_resolved: true

      - url: http://notification-service.originate.svc.cluster.local:8085/api/alerts/haaland
        send_resolved: true
