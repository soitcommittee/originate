apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

configMapGenerator:
  - name: prometheus-config
    files:
      - prometheus.yml
  - name: prometheus-rules
    files:
      - alert-rules.yml
  - name: alertmanager-config
    files:
      - alertmanager.yml
  - name: blackbox-config
    files:
      - blackbox.yml

generatorOptions:
  labels:
    app.kubernetes.io/part-of: originate

resources:
  - prometheus.yaml
  - alertmanager.yaml
  - blackbox-exporter.yaml
