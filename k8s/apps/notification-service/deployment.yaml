apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  labels:
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/part-of: originate
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notification-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notification-service
        app.kubernetes.io/part-of: originate
    spec:
      serviceAccountName: notification-service
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: notification-service
          image: ghcr.io/soitcommittee/originate-notification-service:sha-ea2af19d7cc872d32195fb2cab14e673ba9f50c9
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8085
          env:
            - name: SERVER_PORT
              value: "8085"
            - name: LARK_WIKI_APP_ID
              valueFrom:
                secretKeyRef:
                  name: lark-wiki-credentials
                  key: app-id
            - name: LARK_WIKI_APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: lark-wiki-credentials
                  key: app-secret
            - name: LARK_WIKI_PARENT_URL
              value: https://hjp4kdjoft7w.jp.larksuite.com/wiki/IxVBwtwUvixbxJkO0HajGshMpZf
            - name: LARK_WEBHOOK_CUSTOMER_SERVICE
              valueFrom:
                secretKeyRef:
                  name: lark-webhook-secrets
                  key: customer-service
                  optional: true
            - name: LARK_WEBHOOK_LOAN_SERVICE
              valueFrom:
                secretKeyRef:
                  name: lark-webhook-secrets
                  key: loan-service
                  optional: true
            - name: LARK_WEBHOOK_PRODUCT_SERVICE
              valueFrom:
                secretKeyRef:
                  name: lark-webhook-secrets
                  key: product-service
                  optional: true
            - name: LARK_WEBHOOK_DECISION_SERVICE
              valueFrom:
                secretKeyRef:
                  name: lark-webhook-secrets
                  key: decision-service
                  optional: true
            - name: LARK_WEBHOOK_NOTIFICATION_SERVICE
              valueFrom:
                secretKeyRef:
                  name: lark-webhook-secrets
                  key: notification-service
                  optional: true
            - name: LARK_WEBHOOK_FRONTEND
              valueFrom:
                secretKeyRef:
                  name: lark-webhook-secrets
                  key: frontend
                  optional: true
            - name: LARK_WEBHOOK_PLATFORM
              valueFrom:
                secretKeyRef:
                  name: lark-webhook-secrets
                  key: platform
                  optional: true
            - name: HAALAND_API_BASE_URL
              value: "https://34-143-201-173.sslip.io"
            - name: HAALAND_API_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: haaland-api-credentials
                  key: auth-token
            - name: HAALAND_REPO_URL
              value: "https://github.com/soitcommittee/originate.git"
            - name: HAALAND_BASE_REF
              value: "main"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 4
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: 75m
              memory: 192Mi
            limits:
              cpu: 400m
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  labels:
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/part-of: originate
spec:
  selector:
    app.kubernetes.io/name: notification-service
  ports:
    - name: http
      port: 8085
      targetPort: http
