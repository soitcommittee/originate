apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-provider
  labels:
    app.kubernetes.io/name: payment-provider
    app.kubernetes.io/part-of: originate
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: payment-provider
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payment-provider
        app.kubernetes.io/part-of: originate
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: payment-provider
          image: ghcr.io/soitcommittee/originate-payment-provider:sha-b86b688879ea51a55524af3613a7c8b16bff9b39
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8090
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 60
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: payment-provider
  labels:
    app.kubernetes.io/name: payment-provider
    app.kubernetes.io/part-of: originate
spec:
  selector:
    app.kubernetes.io/name: payment-provider
  ports:
    - name: http
      port: 8090
      targetPort: http
