apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  labels:
    app.kubernetes.io/name: product-service
    app.kubernetes.io/part-of: originate
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: product-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: product-service
        app.kubernetes.io/part-of: originate
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: product-service
          image: ghcr.io/soitcommittee/originate-product-service:sha-473239bd2c93860cdce2e7825a12d3479f7355ab
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8083
          env:
            - name: SERVER_PORT
              value: "8083"
            - name: DEMO_PRODUCT_ERROR_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: product-service-config
                  key: DEMO_PRODUCT_ERROR_ENABLED
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 4
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: 75m
              memory: 192Mi
            limits:
              cpu: 400m
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  labels:
    app.kubernetes.io/name: product-service
    app.kubernetes.io/part-of: originate
spec:
  selector:
    app.kubernetes.io/name: product-service
  ports:
    - name: http
      port: 8083
      targetPort: http
